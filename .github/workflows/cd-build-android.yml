name: CD - Flutter Build APK (Android)

on:
  workflow_dispatch: # Vẫn giữ lại để bấm thủ công khi cần
  push:
    tags:
      - "v*" # Chỉ tự động build khi push Tag có dạng v1.0.0, v1.0.1...

permissions:
  contents: write


jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Pre-download Gradle Distribution
        run: |
          echo "Pre-downloading Gradle 8.13 distribution via curl..."
          curl -sSL --retry 5 --retry-all-errors --connect-timeout 30 "https://services.gradle.org/distributions/gradle-8.13-bin.zip" -o /tmp/gradle-8.13-bin.zip || true

      - name: Build APK (Release)
        run: |
          for i in {1..5}; do
            echo "=== Attempt $i to build APK ==="
            flutter build apk --release && exit 0 || (echo "Attempt $i failed (network 504 timeout), retrying in 10s..." && sleep 10)
          done
          exit 1

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
